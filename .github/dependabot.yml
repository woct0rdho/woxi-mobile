version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /engine
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    # AGP and the Kotlin plugin pin themselves to the SDK and the JDK. A major bump is
    # a migration, not a chore.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    groups:
      js:
        patterns: ["*"]
