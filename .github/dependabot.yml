version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: daily
    ignore:
      # woxi is the interpreter itself. A patch bump is routine, while breaking changes
      # are a deliberate decision, so major bumps stay manual.
      - dependency-name: woxi
        update-types: ["version-update:semver-major"]
    groups:
      cargo:
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    ignore:
      # AGP pins itself to the SDK and the JDK. A major bump is a migration, not a chore.
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      # These live on the Gradle buildscript classpath (they arrive through the Android
      # Gradle plugin, not from app/build.gradle.kts) and are not in the APK. Their
      # advisories have no version we can choose.
      - dependency-name: "com.google.guava:guava"
      - dependency-name: "org.bitbucket.b_c:jose4j"
      - dependency-name: "org.bouncycastle:*"
      - dependency-name: "org.jdom:jdom2"
    groups:
      gradle:
        patterns: ["*"]
      gradle-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      js:
        patterns: ["*"]
