<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Woxi Mobile</title>
<script>
  // Resolve the stored theme before the first paint, so the notebook does not flash
  // the wrong background. app.js re-applies it once the UI is up.
  (function () {
    var mode = 'system', dark = true;
    try {
      var saved = JSON.parse(localStorage.getItem('woxi.notebook.v1') || '{}');
      if (saved.settings && saved.settings.theme) mode = saved.settings.theme;
    } catch (err) {
      // first run
    }
    if (mode === 'light') dark = false;
    else if (mode !== 'dark') dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  })();
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="woxi-splash">
  <div class="woxi-splash-inner">
    <div class="woxi-splash-logo">Woxi</div>
    <div class="woxi-splash-sub">Woxi Mobile</div>
  </div>
</div>

<div id="woxi-app" class="woxi-hidden">
  <header id="woxi-topbar">
    <div id="woxi-title">Untitled</div>
    <div class="woxi-topbar-actions">
      <button type="button" class="woxi-tabbtn" id="woxi-btn-menu">Menu</button>
      <button type="button" class="woxi-tabbtn" id="woxi-btn-options">Options</button>
    </div>
  </header>

  <main id="woxi-notebook"></main>

  <div id="woxi-keyboard">
    <div id="woxi-kb-bar-view">
      <div id="woxi-kb-actions" class="woxi-kb-slide woxi-kb-actions"></div>
    </div>
    <div id="woxi-kb-pad-view">
      <div id="woxi-kb-keys" class="woxi-kb-slide woxi-kb-keys"></div>
    </div>
  </div>
</div>

<div id="woxi-overlay" class="woxi-hidden">
  <div id="woxi-sheet">
    <div id="woxi-sheet-title"></div>
    <div id="woxi-sheet-body"></div>
  </div>
</div>

<div id="woxi-toast" class="woxi-hidden"></div>

<script src="js/keyboard.js"></script>
<script src="js/notebook.js"></script>
<script src="js/woxi-client.js"></script>
<script src="js/render-output.js"></script>
<script src="js/plot-interact.js"></script>
<script src="js/assist.js"></script>
<script src="js/app.js"></script>
</body>
</html>
