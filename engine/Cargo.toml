[package]
name = "woxi-jni"
version = "0.1.0"
edition = "2021"
description = "Android JNI wrapper around the Woxi Wolfram Language interpreter"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "woxi_jni"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23"
jni = "0.22"
# The interpreter core. `default-features = false` drops the CLI (tokio, zeromq,
# rustyline, jupyter) which an embedded engine does not need.
woxi = { version = "0.4.0", default-features = false }

[profile.release]
# Built with all cores. fat LTO + a single codegen unit made the (very large)
# interpreter crate compile single-threaded, which took far longer than the
# size win was worth. The final APK is deflated anyway.
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "unwind"      # panics are caught at the JNI boundary
strip = "symbols"

[profile.fast]
# Development builds: what release sets, minus the two things that make a rebuild slow.
# Thin LTO across the interpreter and debug info are dropped. Incremental compilation keeps
# a rebuild after an edit to a couple of seconds. See README.md for the commands.
inherits = "release"
lto = false
incremental = true
debug = false
